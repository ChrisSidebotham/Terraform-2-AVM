# ======================================================================
# Starter configuration for the Azure Terraform State Importer.
#   https://github.com/Azure/terraform-state-importer
#
# Generated by avmigrate from the resources it converted, so the Resource
# Graph queries below cover exactly those types rather than the whole
# subscription. Widen them if you are migrating in several passes.
#
# BEFORE RUNNING
#   1. Fill in subscriptionIDs below.
#   2. `az login` and select the right subscription.
#   3. Make sure `terraform init` succeeds in the module directory.
#
# USAGE
#   terraform-state-importer run \
#     --config ./terraform-state-importer.config.yaml \
#     --terraformModulePath . \
#     --verbosity info
#
# Then resolve issues.csv and re-run with --issuesCsv to get imports.tf.
# ======================================================================

cloud: "AzurePublic"  # AzurePublic | AzureUSGovernment | AzureChina

subscriptionIDs:
  - "00000000-0000-0000-0000-000000000000"  # TODO(avmigrate): <required> subscription ID

# Terraform resources that are module scaffolding rather than Azure resources.
ignoreResourceTypePatterns:
  - "random_uuid"
  - "random_string"
  - "random_password"
  - "modtm"
  - "terraform_data"
  - "time_sleep"

# Azure resources that are created for you and should not be imported.
ignoreResourceIDPatterns:
  - "resourceGroups/NetworkWatcherRG"
  - "/providers/Microsoft.Security/"

resourceGraphQueries:
  - name: "Resource Groups"
    scope: "Subscription"
    query: |
      resourcecontainers
      | where type == "microsoft.resources/subscriptions/resourcegroups"
      | project id, name, type, location, subscriptionId, resourceGroup = name

  - name: "Migrated resource types"
    scope: "Subscription"
    query: |
      resources
      | where type in~ ("microsoft.network/networksecuritygroups", "microsoft.network/virtualnetworks", "microsoft.operationalinsights/workspaces", "microsoft.storage/storageaccounts")
      | project id, name, type, location, subscriptionId, resourceGroup

# Types covered by the query above:
#   microsoft.network/networksecuritygroups  (Network Security Group)
#   microsoft.network/virtualnetworks  (Virtual Network)
#   microsoft.operationalinsights/workspaces  (Log Analytics workspace)
#   microsoft.storage/storageaccounts  (Storage Account)
