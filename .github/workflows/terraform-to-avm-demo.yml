name: Terraform to AVM presentation demo

# Automatic runs use disposable synthetic fixtures. Manual runs require explicit
# acknowledgement before publishing repository-folder output in a public repo.
on:
  workflow_dispatch:
    inputs:
      root:
        description: Committed Terraform folder in this repository (immediate .tf files only)
        type: string
        default: examples/platform
        required: true
      config_path:
        description: Committed configuration path relative to this repository
        type: string
        default: examples/platform/config.json
        required: true
      mode:
        description: Report-only PR or repair PR with report and proposed fixes
        type: choice
        options: [report, repair]
        default: repair
      acknowledge_public_output:
        description: I confirm the selected source and generated reports may be public
        type: boolean
        default: false
  push:
    branches: [demo/presentation-evidence]
    paths:
      - .github/workflows/terraform-to-avm-demo.yml
      - examples/demo.py
      - examples/demo/*.tf
  pull_request:
    paths:
      - .github/workflows/terraform-to-avm-demo.yml
      - examples/demo.py
      - examples/demo/*.tf

permissions:
  contents: read

jobs:
  convert:
    name: Prepare folder report and proposed fixes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - name: Require deliberate branch dispatch and public-output consent
        env:
          REF_TYPE: ${{ github.ref_type }}
          PRIVATE: ${{ github.event.repository.private }}
          ACKNOWLEDGED: ${{ inputs.acknowledge_public_output }}
        run: |
          test "$REF_TYPE" = branch || { echo "::error::Select a branch, not a tag"; exit 1; }
          if [ "$PRIVATE" != true ] && [ "$ACKNOWLEDGED" != true ]; then
            echo "::error::Confirm acknowledge_public_output before publishing reports in a public repository"
            exit 1
          fi
      - name: Check out committed repository folder and converter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Generate report and proposed repair without editing the checkout
        id: conversion
        env:
          ROOT: ${{ inputs.root }}
          CONFIG_PATH: ${{ inputs.config_path }}
          MODE: ${{ inputs.mode }}
          BUNDLE: ${{ runner.temp }}/presentation-bundle
        run: |
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_RUNTIME_URL ACTIONS_CACHE_URL \
            ACTIONS_CACHE_SERVICE_V2 ACTIONS_RESULTS_URL \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          python -m examples.presentation \
            --repository "$GITHUB_WORKSPACE" --config "$GITHUB_WORKSPACE/$CONFIG_PATH" \
            --root "$ROOT" --mode "$MODE" --output "$BUNDLE"
      - name: Show conversion summary
        if: ${{ always() && steps.conversion.outcome != 'skipped' }}
        env:
          BUNDLE: ${{ runner.temp }}/presentation-bundle
        run: |
          if [ -f "$BUNDLE/summary.md" ]; then
            cat "$BUNDLE/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve report, patch and diagnostics
        id: bundle
        if: ${{ always() && steps.conversion.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: presentation-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: ${{ runner.temp }}/presentation-bundle/

  publish:
    name: Open report or repair draft PR
    needs: convert
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: presentation-publish-${{ github.ref }}-${{ inputs.root }}-${{ inputs.mode }}
      cancel-in-progress: false
    steps:
      - name: Check out publisher only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download this run's report and proposed changes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.convert.outputs.artifact_id }}
          path: ${{ runner.temp }}/presentation-bundle
          merge-multiple: true
      - name: Publish draft PR with report and any repairs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUNDLE: ${{ runner.temp }}/presentation-bundle
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          python -m terraform_to_avm.publish --bundle "$BUNDLE" \
            --repository "$GITHUB_REPOSITORY" --base-branch "$BASE_BRANCH" \
            --include-report > "$RUNNER_TEMP/publication.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          outcome = json.loads((Path(os.environ["RUNNER_TEMP"]) / "publication.json").read_text())
          number = outcome.get("pull_request")
          if not isinstance(number, int):
              raise SystemExit("No draft PR was published; inspect the conversion bundle")
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/pull/{number}"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(f"## Presentation draft PR\n\n{url}\n\nDeployment remains **blocked**.\n")
          PY
      - name: Preserve publication result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: presentation-publication-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/presentation-bundle/result.json
            ${{ runner.temp }}/publication.json

  demo:
    if: github.event_name != 'workflow_dispatch'
    name: Synthetic ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [report, repair, no-change]
    steps:
      - name: Check out synthetic fixtures and converter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Exercise real conversion and verify demo expectations
        env:
          SCENARIO: ${{ matrix.scenario }}
          OUTPUT: ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}
          TF_IN_AUTOMATION: 'true'
          CHECKPOINT_DISABLE: '1'
        run: |
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_RUNTIME_URL ACTIONS_CACHE_URL \
            ACTIONS_CACHE_SERVICE_V2 ACTIONS_RESULTS_URL \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          python -m examples.demo --scenario "$SCENARIO" --output "$OUTPUT"
      - name: Show verified synthetic results
        if: success()
        env:
          OUTPUT: ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}
        run: cat "$OUTPUT/demo-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve synthetic demo evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-demo-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/demo-evidence.json
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/demo-summary.md
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/source-before.tf
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/source-after.tf
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/result.json
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/summary.md
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/repair-manifest.json
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/changes.json
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/repeat-changes.json
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/repair.patch
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/private/*.json
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/private/*.log
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/private/*.txt
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/private/plan-artifacts/*
            ${{ runner.temp }}/synthetic-demo-${{ matrix.scenario }}/repeat-failure/**
