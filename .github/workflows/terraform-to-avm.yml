name: Terraform to AVM

# External callers must pin this workflow @<full SHA> and pass that SAME SHA as
# factory_ref. github.workflow_ref/workflow_sha identify the caller, not us.
# This explicit release contract avoids requesting an OIDC identity just to
# discover job_workflow_ref. Never accept consumer code as the factory.
on:
  workflow_call:
    inputs:
      factory_ref:
        description: Full 40-character factory commit SHA; must match the reusable workflow release
        required: true
        type: string
      config_path:
        description: Consumer-relative path to the JSON configuration
        required: true
        type: string
      root:
        description: Consumer-relative Terraform root
        required: true
        type: string
      base_branch:
        description: Consumer branch to analyze and target with a draft pull request
        required: true
        type: string
      mode:
        description: report or repair
        default: report
        type: string
      publish:
        description: Opt in to draft pull request publication (manual repair runs only)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: terraform-to-avm-${{ github.repository }}-${{ inputs.root }}
  cancel-in-progress: false

jobs:
  convert:
    name: Analyze consumer (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      publish_eligible: ${{ steps.eligibility.outputs.publish_eligible }}
    steps:
      - name: Validate release and input paths
        env:
          FACTORY_REF: ${{ inputs.factory_ref }}
          CONFIG_PATH: ${{ inputs.config_path }}
          ROOT: ${{ inputs.root }}
          MODE: ${{ inputs.mode }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          CONSUMER_PRIVATE: ${{ github.event.repository.private }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          if os.environ["CONSUMER_PRIVATE"].lower() != "true":
              raise SystemExit("Sensitive report artifacts require a private consumer repository")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", os.environ["FACTORY_REF"]):
              raise SystemExit("factory_ref must be a full factory commit SHA")
          if os.environ["MODE"] not in {"report", "repair"}:
              raise SystemExit("mode must be report or repair")
          for name in ("CONFIG_PATH", "ROOT"):
              value = os.environ[name]
              path = pathlib.PurePosixPath(value)
              if not value or path.is_absolute() or ".." in path.parts or "\\" in value:
                  raise SystemExit(f"{name} must be a repository-relative path")
          subprocess.run(
              ["git", "check-ref-format", "refs/heads/" + os.environ["BASE_BRANCH"]],
              check=True,
          )
          PY
      - name: Check out trusted factory release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ChrisSidebotham/Terraform-2-AVM
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false
      - name: Check out consumer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.base_branch }}
          path: consumer
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # Installation, terraform init, and provider/module discovery need network.
      # No Azure credentials, OIDC tokens, state, or plans are supplied.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Run conversion
        id: conversion
        working-directory: factory
        env:
          CONSUMER: ${{ github.workspace }}/consumer
          CONFIG_PATH: ${{ inputs.config_path }}
          ROOT: ${{ inputs.root }}
          MODE: ${{ inputs.mode }}
          BUNDLE: ${{ github.workspace }}/bundle
          TF_IN_AUTOMATION: 'true'
          CHECKPOINT_DISABLE: '1'
        run: |
          python -m terraform_to_avm run \
            --repository "$CONSUMER" \
            --config "$CONSUMER/$CONFIG_PATH" \
            --root "$ROOT" \
            --mode "$MODE" \
            --output "$BUNDLE"
      - name: Identify reviewable repairs even when static gates fail
        id: eligibility
        if: ${{ always() && steps.conversion.outcome != 'skipped' }}
        env:
          BUNDLE: ${{ github.workspace }}/bundle
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          bundle = Path(os.environ["BUNDLE"])
          eligible = False
          try:
              result_path, changes_path = bundle / "result.json", bundle / "changes.json"
              if result_path.stat().st_size <= 256 * 1024 and changes_path.stat().st_size <= 8 * 1024 * 1024:
                  result = json.loads(result_path.read_text())
                  changes = json.loads(changes_path.read_text())
                  eligible = (
                      result.get("mode") == "repair"
                      and bool(changes.get("files"))
                      and not (bundle / "private/failure.txt").exists()
                      and not any(item.get("code") == "stage_failed" for item in result.get("findings", []))
                  )
          except (OSError, ValueError, TypeError, AttributeError):
              pass
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"publish_eligible={str(eligible).lower()}\n")
          PY
      - name: Add safe job summary
        if: always()
        run: |
          printf '%s\n' \
            '## Terraform to AVM' \
            'Conversion diagnostics, when available, are in the restricted reports artifact.' \
            'Reports and patches may contain sensitive source. Do not copy them into public issues or logs.' \
            >> "$GITHUB_STEP_SUMMARY"
      # Do not publish summary.md or changes.json in the public job summary:
      # these files, the patch, and raw reports can contain consumer source.
      # Artifact visibility follows repository permissions; use a PRIVATE
      # consumer repository (enforced above). Public-repo artifacts are NOT
      # private merely because they are named "private".
      - name: Preserve diagnostic bundle, including failed conversions
        id: bundle
        if: ${{ always() && steps.conversion.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-to-avm-private-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false
          path: |
            bundle/result.json
            bundle/summary.md
            bundle/changes.json
            bundle/repair-manifest.json
            bundle/repair.patch
            bundle/private/*.json
            bundle/private/*.log
            bundle/private/*.txt
            bundle/private/plan-artifacts/*
            !bundle/**/.terraform/**
            !bundle/**/*.tfstate
            !bundle/**/*.tfstate.*
            !bundle/**/*.tfplan
            !bundle/**/*.plan
            !bundle/**/tfplan

  publish:
    name: Publish reviewed repair bundle
    needs: convert
    if: ${{ always() && !cancelled() && inputs.publish && inputs.mode == 'repair' && github.event_name == 'workflow_dispatch' && needs.convert.outputs.publish_eligible == 'true' && needs.convert.outputs.artifact_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No consumer checkout, consumer tools, or consumer scripts in this job.
      - name: Check out trusted publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ChrisSidebotham/Terraform-2-AVM
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download only this conversion's bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.convert.outputs.artifact_id }}
          path: bundle
          merge-multiple: true
      - name: Publish draft pull request
        id: publication
        working-directory: factory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUNDLE: ${{ github.workspace }}/bundle
          CONSUMER_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          python -m terraform_to_avm.publish \
            --bundle "$BUNDLE" \
            --repository "$CONSUMER_REPOSITORY" \
            --base-branch "$BASE_BRANCH"
      - name: Preserve final promotion result
        if: ${{ always() && steps.publication.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-to-avm-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: bundle/result.json
