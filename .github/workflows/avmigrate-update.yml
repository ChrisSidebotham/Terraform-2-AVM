name: Check latest avmigrate and propose dependency update

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avmigrate-dependency-update
  cancel-in-progress: false

jobs:
  compatibility:
    if: >-
      github.repository == 'ChrisSidebotham/Terraform-2-AVM' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      candidate_revision: ${{ steps.candidate.outputs.candidate_revision }}
      candidate_sha256: ${{ steps.candidate.outputs.candidate_sha256 }}
    steps:
      - name: Check out trusted factory source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build trusted test image before handling candidate code
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag avmigrate-offline-tests - <<'DOCKERFILE'
          FROM python:3.12-slim@sha256:6b25cbe6577518889d553cdd5a5da97d259348d8f6e45b527dd731caaba27a07
          RUN apt-get update && apt-get install -y --no-install-recommends git \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
      - name: Fetch and statically validate one immutable upstream candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 \
            python -m terraform_to_avm.gist_update fetch \
            --output "$RUNNER_TEMP/avmigrate-candidate"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil

          candidate = Path(os.environ["RUNNER_TEMP"]) / "avmigrate-candidate"
          provenance = json.loads((candidate / "provenance.json").read_text())
          revision = provenance.get("git_revision")
          digest = provenance.get("sha256")
          version = provenance.get("version")
          if not (
              isinstance(revision, str) and re.fullmatch(r"[0-9a-f]{40}", revision)
              and isinstance(digest, str) and re.fullmatch(r"[0-9a-f]{64}", digest)
              and isinstance(version, str) and version
              and hashlib.sha256((candidate / "avmigrate.py").read_bytes()).hexdigest() == digest
          ):
              raise SystemExit("Candidate identity validation failed.")

          snapshot = Path(os.environ["RUNNER_TEMP"]) / "avmigrate-factory"
          snapshot.mkdir()
          source = Path.cwd()
          for name in ("terraform_to_avm", "tests", "vendor", "examples"):
              shutil.copytree(
                  source / name, snapshot / name,
                  ignore=shutil.ignore_patterns("__pycache__", "*.pyc", ".publish-fixture-*"),
              )
          for name in ("README.md", "LICENSE", ".gitignore"):
              shutil.copyfile(source / name, snapshot / name)
          vendor = snapshot / "vendor" / "avmigrate"
          (vendor / "upstream-license.txt").unlink(missing_ok=True)
          for name in ("avmigrate.py", "provenance.json", "upstream-license.txt"):
              if (candidate / name).is_file():
                  shutil.copyfile(candidate / name, vendor / name)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"candidate_revision={revision}\ncandidate_sha256={digest}\n")
          PY
      - name: Run compatibility tests without credentials, network, or writable source
        shell: bash
        run: |
          set -euo pipefail
          # Bound diagnostics without interpreting candidate output as workflow commands.
          # pipefail also rejects Docker failures when the log cap closes the pipe.
          container="avmigrate-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm --force "$container" > /dev/null 2>&1 || true' EXIT
          if timeout --kill-after=10s 600s docker run --rm --interactive --name "$container" \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 65534:65534 --pids-limit 128 --memory 512m --cpus 2 \
            --tmpfs /scratch:rw,exec,nosuid,nodev,size=256m,mode=1777 \
            --mount "type=bind,source=$RUNNER_TEMP/avmigrate-factory,target=/factory,readonly" \
            --workdir /factory \
            --env PYTHONDONTWRITEBYTECODE=1 --env PYTHONPATH=/factory \
            --env TMPDIR=/scratch --env HOME=/scratch \
            --env TERRAFORM_TO_AVM_INTEGRATION=0 \
            avmigrate-offline-tests python - <<'PY' 2>&1 | head -c 1048576 > "$RUNNER_TEMP/avmigrate-compatibility.log"
          import pathlib
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("/factory/tests")
          # Publisher fixtures are relative to __file__; keep their writes off the source mount.
          pathlib.Path("/scratch/tests").mkdir()
          sys.modules["test_publish"].__file__ = "/scratch/tests/test_publish.py"
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful())
          PY
          then
            echo "Offline candidate compatibility tests passed."
          else
            echo "::error::Offline candidate compatibility tests failed or timed out."
            exit 1
          fi
      - name: Retain bounded synthetic diagnostics and pristine candidate provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avmigrate-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/avmigrate-compatibility.log
            ${{ runner.temp }}/avmigrate-candidate/provenance.json
          retention-days: 3
          if-no-files-found: warn

  publish:
    needs: compatibility
    if: >-
      needs.compatibility.result == 'success' &&
      github.repository == 'ChrisSidebotham/Terraform-2-AVM' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted publisher, never candidate code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Independently refetch verified bytes and propose a narrow draft dependency PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_REVISION: ${{ needs.compatibility.outputs.candidate_revision }}
          CANDIDATE_SHA256: ${{ needs.compatibility.outputs.candidate_sha256 }}
          FACTORY_REPOSITORY: ${{ github.repository }}
          BASE_COMMIT: ${{ github.sha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          python -m terraform_to_avm.gist_update publish \
            --revision "$CANDIDATE_REVISION" \
            --sha256 "$CANDIDATE_SHA256" \
            --repository "$FACTORY_REPOSITORY" \
            --base-commit "$BASE_COMMIT" \
            --base-branch "$BASE_BRANCH"
